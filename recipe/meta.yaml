{% set name = "atomgpt" %}
{% set version = "2024.11.30" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/usnistgov/atomgpt/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 1c143c6b8ddd061a30f42161b81664bfb6c93b2b53bd06e105b83aac1d781098

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.10
    - setuptools
    - wheel
    - pip
  run:
    - python >=3.10
    - numpy >=1.19.5
    - scipy >=1.6.1
    - jarvis-tools >=2021.07.19
    - pytorch
    - mpmath >=1.3.0
    - trl
    - peft
    - accelerate
    - bitsandbytes
    - triton
    - sentencepiece
    - transformers
    - xformers
    - spglib >=2.0.2
    - scikit-learn >=0.22.2
    - matplotlib-base >=3.4.1
    - tqdm >=4.60.0
    - pandas >=1.2.3
    - pydantic >=1.8.1
    - pydantic-settings
    - flake8 >=3.9.1
    - pycodestyle >=2.7.0
    - pydocstyle >=6.0.0
    - pyparsing >=2.2.1,<3
  run_constrained:
    - pytorch-cuda >=11.8

test:
  imports:
    - atomgpt
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/usnistgov/atomgpt
  summary: Atomistic Generative Pretrained Transformer
  license: NIST-PD
  license_file: LICENSE.rst

extra:
  recipe-maintainers:
    - knc6
